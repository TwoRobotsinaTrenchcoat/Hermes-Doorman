name: doorman
version: "0.2.3"
description: "Wake-on-LAN doorman for sleeping inference backends. When an attempt targets a mapped host that is asleep, broadcasts a magic packet and waits (bounded) for the inference port to open; then holds a keep-alive (one packet per interval) for the whole life of the request, released by post_api_request / post_auxiliary_call / api_request_error (only when terminal — retryable errors keep the hold through the gateway's backoff), with a leak cap (default 7200s) and one final post-release grace packet (default 30s). Per-host cooldown stops repeat wake packets inside one sleep-wake cycle. Every failure path is a verbose warning and never touches the turn. Config lives in the doorman: block of config.yaml (named-targets, flat, or list-of-rows forms; v0.2.3 renamed the block; the pre-0.2.3 provider_wol: spelling is no longer read) and is re-read per hook fire, so mapping edits need no restart."
kind: standalone
author: community contribution
hooks:
  - pre_api_request
  - pre_auxiliary_call
  - post_api_request
  - post_auxiliary_call
  - api_request_error
provides_hooks:
  - pre_api_request
  - pre_auxiliary_call
  - post_api_request
  - post_auxiliary_call
  - api_request_error
  - agent_loop_stopped
requires_hermes: ">=0.22"
